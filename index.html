:root{
  --paper:#FFF8E7;   /* 地。バニラ寄りの生成り */
  --ink:#4A3728;     /* 文字。こげ茶 */
  --honey:#E8B04B;   /* スコア・コンボ・タイマーの輪 */
  --sakura:#F2A9B4;  /* 誤答スタンプ・ライフ減少の余韻 */
  --wakaba:#A8D5A2;  /* 正解スタンプ */
  --night:#2B2F4A;   /* 最終面の地 */
  --milk:#EFE3CC;    /* 区切り・淡い枠。灰色の代わり */

  --bg:var(--paper);
  --fg:var(--ink);
  --track:var(--milk);   /* タイマーの輪の消費済み側 */
  --edge:#D2C8B7;    /* 写真の内側の縁。明るい写真でも地との段差を残す */
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --frame:24px;      /* 画像枠 */
  --pill:999px;      /* ボタン類 */
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100svh; overflow:hidden;
  /* HUD・canvas・足元をひとかたまりにして画面中央へ。
     1fr で伸ばすと HUD と写真の間が開いてしまう。 */
  display:grid; grid-template-rows:auto auto auto;
  justify-items:center; align-content:center;
  background:var(--bg); color:var(--fg);
  font:500 16px/1.6 var(--font);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
/* 夜は --milk のままだと紺の中で白板のように光るので地に沈める。 */
body.night{--fg:var(--paper); --track:#3E4463}
[hidden]{display:none!important}

/* canvas はページ内に1枚だけ、DOM 順で最初。PLiCy が最初の canvas を
   サムネにするので、見た目の並びは grid-row で後から決める。 */
#stage{
  grid-row:2;
  width:min(92vw,60vh); aspect-ratio:1/1; display:block;
}

.paw{width:22px;height:22px;fill:currentColor;flex:none}
.paw.lost{opacity:.3}

/* --- HUD --- */
#hud{
  grid-row:1; width:min(92vw,60vh);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 2px; padding-top:calc(14px + env(safe-area-inset-top));
}
#life{display:flex; gap:5px}
.hud-c{display:flex; align-items:center; gap:8px; min-width:0}
.hud-r{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
#stageName{font-size:14px; white-space:nowrap}
#qCount,#score,#combo{font-weight:700; font-variant-numeric:tabular-nums}
#qCount{font-size:13px; opacity:.7}
#score{font-size:22px}
#combo{font-size:13px; color:var(--honey)}

/* --- タイトル下（HTML 側） --- */
#footer,#loading{
  grid-row:3; display:flex; flex-direction:column; align-items:center; gap:12px;
  padding:16px 12px; padding-bottom:calc(16px + env(safe-area-inset-bottom));
  text-align:center;
}
#tapHint{font-size:15px; opacity:.8}
#guide{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.chip{
  display:inline-flex; align-items:center; gap:8px;
  border:2px solid var(--milk); border-radius:var(--pill);
  padding:8px 18px; font-size:14px;
}
.dot{width:11px;height:11px;border:2px solid var(--milk);border-radius:var(--pill);flex:none}
#note{font-size:11px; opacity:.55; line-height:1.5}
#loading{font-size:14px; opacity:.6}

/* --- 結果 --- */
#result{
  position:fixed; inset:0; z-index:5; background:var(--bg); color:var(--fg);
  overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:32px 16px calc(40px + env(safe-area-inset-bottom));
  text-align:center;
}
/* 中身が短ければ縦中央、長ければ上から。justify-content:center だと
   あふれたときに上が切れてスクロールできなくなる。 */
#result>*:first-child{margin-top:auto}
#result>*:last-child{margin-bottom:auto}
#resultTitle{font-size:clamp(26px,7vw,38px); font-weight:700}
#resultScore{
  font-size:clamp(44px,14vw,72px); font-weight:700; line-height:1.05;
  color:var(--honey); font-variant-numeric:tabular-nums;
}
#resultReach{font-size:15px; opacity:.75}
#resultBody{display:flex; flex-direction:column; gap:22px; width:100%; max-width:560px}
.group h3{font-size:14px; font-weight:700; margin-bottom:26px}
.cards{display:flex; flex-wrap:wrap; gap:16px 14px; justify-content:center}
.card{width:112px; position:relative; transform:rotate(var(--tilt,0deg))}
.card img{
  width:112px; height:112px; object-fit:cover; display:block;
  border-radius:var(--frame); border:2px solid var(--track); background:var(--track);
}
/* マスキングテープ風の帯。半透明にして写真を透かさないと
   「角が欠けている」ようにしか見えない。 */
.tape{
  position:absolute; top:-3px; left:-11px; width:44px; height:14px;
  background:var(--track); opacity:.88; transform:rotate(-45deg);
}
.card figcaption{font-size:12px; line-height:1.4; margin-top:8px}
.card figcaption span{display:block}
.card figcaption .lead{font-size:10px; opacity:.6}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px}
.grid img{
  width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
  border-radius:var(--frame); border:2px solid var(--track); background:var(--track);
}
#retry{
  border:0; border-radius:var(--pill); cursor:pointer;
  background:var(--ink); color:var(--paper);
  font:700 17px var(--font); padding:15px 42px; margin-top:4px;
}
body.night #retry{background:var(--paper); color:var(--night)}
</style>
</head>
