<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>犬か。犬以外か。</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%90%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="hud" class="hidden">
    <div class="hud-left">
      <span id="levelName">1面</span>
      <span id="qCount" class="sub">1 / 12</span>
    </div>
    <div class="hud-center"><span id="life">🐕🐕🐕</span></div>
    <div class="hud-right">
      <span id="score">0</span>
      <span id="combo" class="sub"></span>
    </div>
  </header>

  <main id="playfield" class="hidden">
    <div class="stage-wrap">
      <canvas id="stage" width="512" height="512"></canvas>
      <div id="verdict" class="verdict hidden"></div>
    </div>
    <div class="timebar"><div id="bar"></div></div>
  </main>

  <section id="screenTitle" class="screen hidden">
    <h1 class="title">犬か。<br>犬以外か。</h1>
    <p class="tap">タップで開始</p>
    <div class="guide">
      <div class="guide-half">← 左：犬</div>
      <div class="guide-half">右：犬以外 →</div>
    </div>
  </section>

  <section id="screenOver" class="screen hidden">
    <h2 id="overTitle" class="over-title">GAME OVER</h2>
    <p class="over-score"><span id="overScore">0</span><small>pt</small></p>
    <p id="overStats" class="over-stats"></p>
    <p id="missesNote" class="misses-note"></p>
    <div id="misses" class="misses"></div>
    <p class="tap">タップでリトライ</p>
  </section>

  <p id="loading" class="loading">読み込み中…</p>
</div>

<script src="js/images-fallback.js"></script>
<script src="js/images.js"></script>
<script src="js/assets.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
